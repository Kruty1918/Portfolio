            <script defer="" data-name="navigation-logic">
              document.addEventListener('DOMContentLoaded', function() {
                (function(){
                  const toggleBtn = document.getElementById("nav-toggle")
                  const closeBtn = document.getElementById("nav-close")
                  const overlay = document.getElementById("mobile-overlay")
                  const mobileLinks = document.querySelectorAll(".navigation-mobile-link")

                  function openMenu() {
                    overlay.classList.add("is-active")
                    toggleBtn.setAttribute("aria-expanded", "true")
                    document.body.style.overflow = "hidden"
                  }

                  function closeMenu() {
                    overlay.classList.remove("is-active")
                    toggleBtn.setAttribute("aria-expanded", "false")
                    document.body.style.overflow = ""
                  }

                  toggleBtn.addEventListener("click", openMenu)
                  closeBtn.addEventListener("click", closeMenu)

                  mobileLinks.forEach((link) => {
                    link.addEventListener("click", closeMenu)
                  })

                  window.addEventListener("resize", () => {
                    if (window.innerWidth > 767 && overlay.classList.contains("is-active")) {
                      closeMenu()
                    }
                  })

                  let lastScroll = 0
                  const navRoot = document.querySelector(".navigation-root")

                  window.addEventListener("scroll", () => {
                    const currentScroll = window.pageYOffset

                    if (currentScroll <= 0) {
                      navRoot.style.transform = "translateY(0)"
                      return
                    }

                    if (currentScroll > lastScroll && !overlay.classList.contains("is-active")) {
                      // Scrolling down
                      navRoot.style.transform = "translateY(-100%)"
                    } else {
                      // Scrolling up
                      navRoot.style.transform = "translateY(0)"
                    }

                    lastScroll = currentScroll
                  })
                })()
              });
            </script>
          </div>
